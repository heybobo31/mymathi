<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zahlenwerkstatt — Baue die Zahl</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #faf6ef;
    --bg-paper: #fffdf8;
    --ink: #2b2a26;
    --ink-soft: #6a6760;
    --accent-clay: #d77a4b;
    --accent-moss: #6b8e4e;
    --accent-sun: #e8b04b;
    --shadow-soft: 0 2px 6px rgba(43,42,38,0.06), 0 8px 24px rgba(43,42,38,0.04);
    --shadow-block: 0 3px 0 rgba(43,42,38,0.18), 0 6px 14px rgba(43,42,38,0.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg-cream);
    color: var(--ink);
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow-x: hidden;
  }

  .app { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .brand-mark { font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 28px; line-height: 1; }
  .brand-mark::first-letter { color: var(--accent-clay); }
  .lang-switch { display: flex; gap: 4px; background: var(--bg-paper); padding: 4px; border-radius: 999px; box-shadow: var(--shadow-soft); }
  .lang-btn { border: none; background: transparent; padding: 6px 12px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
  .lang-btn.active { background: var(--ink); color: var(--bg-paper); }

  .task { background: var(--bg-paper); border-radius: 20px; padding: 14px 22px; margin-bottom: 14px; box-shadow: var(--shadow-soft); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .task-target { display: flex; align-items: baseline; gap: 12px; flex: 1; min-width: 180px; }
  .task-label { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; }
  .task-target-num { font-family: 'Fraunces', Georgia, serif; font-size: 48px; font-weight: 800; color: var(--accent-clay); line-height: 0.9; }
  .task-counter { display: flex; align-items: center; gap: 10px; background: var(--bg-cream); padding: 8px 16px; border-radius: 999px; }
  .counter-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; text-transform: uppercase; }
  .counter-num { font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 800; min-width: 28px; text-align: center; transition: color 0.3s, transform 0.3s; }
  .counter-num.match { color: var(--accent-moss); transform: scale(1.15); }
  .counter-num.over { color: var(--accent-clay); }

  .feedback { background: var(--bg-paper); border-radius: 20px; padding: 12px 18px; box-shadow: var(--shadow-soft); margin-bottom: 14px; min-height: 50px; display: flex; align-items: center; gap: 12px; transition: background 0.3s; }
  .feedback-icon { font-size: 26px; flex-shrink: 0; }
  .feedback-text { font-size: 14px; line-height: 1.4; font-weight: 500; }
  .feedback.success { background: linear-gradient(135deg, #e8f3dc, #d4ead4); }
  .feedback.discover { background: linear-gradient(135deg, #fff3d6, #ffe9b3); }

  .workspace { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 14px; }
  @media (min-width: 720px) { .workspace { grid-template-columns: 1.2fr 1fr; } }

  .dropzone { background: var(--bg-paper); border-radius: 20px; padding: 16px; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; }
  .dropzone-title, .palette-title { font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 600; color: var(--ink-soft); margin: 0 0 10px; }

  .stack-area {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 30px; padding: 16px 12px 36px; border-radius: 14px;
    background-color: #f5f0e6;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(43,42,38,0.08) 27px, rgba(43,42,38,0.08) 28px);
    min-height: 360px; position: relative; transition: background-color 0.2s;
  }

  .column { display: flex; flex-direction: column-reverse; align-items: center; min-width: 70px; position: relative; }
  .column-label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-family: 'Fraunces', Georgia, serif; font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .column.target .column-label { color: var(--accent-clay); }

  .stack-column-zone { width: 60px; min-height: 60px; border-radius: 10px; display: flex; flex-direction: column-reverse; align-items: center; border: 2px dashed transparent; transition: border-color 0.2s, background 0.2s; padding: 2px; }
  .stack-column-zone.empty { border-color: rgba(43,42,38,0.2); background: rgba(255,255,255,0.4); }
  .stack-column-zone.dragover { border-color: var(--accent-clay); background: rgba(232,176,75,0.15); }
  .stack-column-zone-hint { color: var(--ink-soft); font-size: 11px; font-style: italic; text-align: center; padding: 8px 4px; pointer-events: none; }
  .stack-column-zone:not(.empty) .stack-column-zone-hint { display: none; }

  .block {
    width: 56px; border-radius: 8px; box-shadow: var(--shadow-block);
    cursor: grab; display: flex; flex-direction: column-reverse; align-items: center;
    padding: 4px; transition: transform 0.15s, box-shadow 0.15s;
    position: relative; flex-shrink: 0;
    color: rgba(43,42,38,0.85); font-family: 'Fraunces', Georgia, serif; font-weight: 800;
    touch-action: none; margin: 0;
  }

  .stack-column-zone .block { margin: 0; border-radius: 4px; box-shadow: 0 2px 0 rgba(43,42,38,0.15), 0 4px 8px rgba(43,42,38,0.08); }
  .stack-column-zone .block:first-child { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
  .stack-column-zone .block:last-child  { border-top-left-radius: 8px; border-top-right-radius: 8px; }

  .block.target-block { cursor: default; box-shadow: 0 3px 0 rgba(43,42,38,0.15), 0 6px 14px rgba(43,42,38,0.08); border-radius: 8px; border: 2px dashed rgba(43,42,38,0.25); opacity: 0.85; }
  .block:not(.target-block):hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(43,42,38,0.18), 0 10px 20px rgba(43,42,38,0.14); }
  .block.dragging { opacity: 0.4; cursor: grabbing; }
  .block.ghost { position: fixed; z-index: 1000; pointer-events: none; opacity: 0.95; transform: scale(1.08); box-shadow: 0 8px 0 rgba(43,42,38,0.20), 0 16px 32px rgba(43,42,38,0.20); margin: 0; }

  .block-num { font-size: 16px; margin-top: 2px; line-height: 1; }
  .block-dots { display: flex; flex-direction: column-reverse; gap: 2px; align-items: center; width: 100%; }
  .dot-row { display: flex; gap: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(43,42,38,0.45); }

  .palette { background: var(--bg-paper); border-radius: 20px; padding: 16px; box-shadow: var(--shadow-soft); transition: background 0.2s; }
  .palette.dragover { background: rgba(107,142,78,0.10); }
  .palette-hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; font-style: italic; }
  .palette-grid { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; justify-content: center; min-height: 290px; }

  .solutions { background: var(--bg-paper); border-radius: 20px; padding: 16px; box-shadow: var(--shadow-soft); }
  .solutions-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .solutions-title { font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; margin: 0; }
  .solutions-count { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .solutions-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
  .solution-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--bg-cream); font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 14px; animation: chipPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .solution-chip-star { color: var(--accent-sun); font-size: 12px; }
  .solutions-empty { color: var(--ink-soft); font-style: italic; font-size: 13px; }
  @keyframes chipPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .btn { border: none; padding: 10px 20px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; background: transparent; color: var(--ink-soft); border: 2px solid rgba(43,42,38,0.12); touch-action: manipulation; }
  .btn:hover { color: var(--ink); border-color: var(--ink); }

  .celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
  .confetti { position: absolute; width: 10px; height: 14px; border-radius: 2px; animation: fall 1.6s ease-out forwards; }
  @keyframes fall { 0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand-mark">Zahlenwerkstatt</div>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-btn active" data-lang="de">DE</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="lu">LU</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <div class="task">
    <div class="task-target">
      <span class="task-label" data-i18n="build">Baue die</span>
      <span class="task-target-num" id="targetNum">10</span>
    </div>
    <div class="task-counter">
      <span class="counter-label" data-i18n="yourTower">Dein Turm</span>
      <span class="counter-num" id="counter">0</span>
    </div>
  </div>

  <div class="feedback" id="feedback">
    <span class="feedback-icon">🌱</span>
    <span class="feedback-text" data-i18n="welcome">Stapele Bausteine so hoch wie der Zielturm!</span>
  </div>

  <div class="workspace">
    <div class="dropzone">
      <h3 class="dropzone-title" data-i18n="stack">Bauplatz</h3>
      <div class="stack-area" id="stackArea">
        <div class="column target">
          <div id="targetBlockHolder"></div>
          <div class="column-label" data-i18n="target">Ziel</div>
        </div>
        <div class="column">
          <div class="stack-column-zone empty" id="stackColumn">
            <div class="stack-column-zone-hint" data-i18n="dropHere">Hier stapeln</div>
          </div>
          <div class="column-label" data-i18n="yourStack">Dein Stapel</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="clearBtn">↺ <span data-i18n="clear">Neu beginnen</span></button>
        <button class="btn" id="newTargetBtn">🎲 <span data-i18n="newTarget">Neue Zahl</span></button>
      </div>
    </div>

    <div class="palette" id="palette">
      <h3 class="palette-title" data-i18n="palette">Bausteine</h3>
      <p class="palette-hint" data-i18n="hint">Ziehen oder antippen — zurück ziehen zum Entfernen</p>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>
  </div>

  <div class="solutions">
    <div class="solutions-header">
      <h3 class="solutions-title" data-i18n="discoveries">Deine Entdeckungen</h3>
      <span class="solutions-count" id="solutionsCount">0</span>
    </div>
    <div class="solutions-list" id="solutionsList">
      <span class="solutions-empty" data-i18n="noSolutions">Noch keine Lösung gefunden — probier's aus!</span>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate"></div>

<script>
const UNIT = 28;
let TARGET = 10;
const COLORS = { 1:'#e57373', 2:'#ffb74d', 3:'#fff176', 4:'#aed581', 5:'#4db6ac', 6:'#64b5f6', 7:'#7986cb', 8:'#ba68c8', 9:'#f06292', 10:'#a1887f' };

const i18n = {
  de: {
    build: "Baue die", yourTower: "Dein Turm",
    welcome: "Stapele Bausteine so hoch wie der Zielturm!",
    stack: "Bauplatz", dropHere: "Hier stapeln",
    target: "Ziel", yourStack: "Dein Stapel",
    palette: "Bausteine", hint: "Ziehen oder antippen — zurück ziehen zum Entfernen",
    clear: "Neu beginnen", newTarget: "Neue Zahl",
    discoveries: "Deine Entdeckungen",
    noSolutions: "Noch keine Lösung gefunden — probier's aus!",
    fb_empty: "Stapele Bausteine so hoch wie der Zielturm!",
    fb_match: (n) => `Geschafft! Du hast die ${n} gebaut! 🎉`,
    fb_under: (n, t) => `Dein Turm ist noch um ${t - n} kleiner. Was passt noch dazu?`,
    fb_over:  (n, t) => `Dein Turm ist um ${n - t} zu hoch. Welcher Baustein muss weg?`,
    fb_new_solution: "Neue Lösung entdeckt! ✨",
  },
  fr: {
    build: "Construis le", yourTower: "Ta tour",
    welcome: "Empile des blocs aussi haut que la tour cible !",
    stack: "Chantier", dropHere: "Empile ici",
    target: "Cible", yourStack: "Ta tour",
    palette: "Blocs", hint: "Glisse ou tape — ramène un bloc pour l'enlever",
    clear: "Recommencer", newTarget: "Nouveau nombre",
    discoveries: "Tes découvertes",
    noSolutions: "Aucune solution trouvée — essaie !",
    fb_empty: "Empile des blocs aussi haut que la tour cible !",
    fb_match: (n) => `Bravo ! Tu as construit ${n} ! 🎉`,
    fb_under: (n, t) => `Il manque ${t - n} à ta tour.`,
    fb_over:  (n, t) => `Ta tour dépasse de ${n - t}.`,
    fb_new_solution: "Nouvelle solution découverte ! ✨",
  },
  lu: {
    build: "Bau d'", yourTower: "Däin Tuerm",
    welcome: "Stapelt Bléck esou héich wéi den Zilltuerm!",
    stack: "Bauplaz", dropHere: "Hei stapelen",
    target: "Zil", yourStack: "Däin Stapel",
    palette: "Bléck", hint: "Zéien oder klicken — zréck zéien fir ewechzehuelen",
    clear: "Nei ufänken", newTarget: "Nei Zuel",
    discoveries: "Deng Entdeckungen",
    noSolutions: "Nach keng Léisung fonnt!",
    fb_empty: "Stapelt Bléck esou héich wéi den Zilltuerm!",
    fb_match: (n) => `Gemaach! Du hues ${n} gebaut! 🎉`,
    fb_under: (n, t) => `Däin Tuerm ass nach ëm ${t - n} méi kleng.`,
    fb_over:  (n, t) => `Däin Tuerm ass ëm ${n - t} ze héich.`,
    fb_new_solution: "Nei Léisung entdeckt! ✨",
  },
  en: {
    build: "Build", yourTower: "Your tower",
    welcome: "Stack blocks as tall as the target tower!",
    stack: "Workspace", dropHere: "Stack here",
    target: "Target", yourStack: "Your stack",
    palette: "Blocks", hint: "Drag or tap — drag back to remove",
    clear: "Start over", newTarget: "New number",
    discoveries: "Your discoveries",
    noSolutions: "No solution yet — try!",
    fb_empty: "Stack blocks as tall as the target tower!",
    fb_match: (n) => `Got it! You built ${n}! 🎉`,
    fb_under: (n, t) => `Your tower is ${t - n} shorter.`,
    fb_over:  (n, t) => `Your tower is ${n - t} too tall.`,
    fb_new_solution: "New solution found! ✨",
  },
};

let currentLang = "de";
const t = (key, ...args) => { const v = i18n[currentLang][key]; return typeof v === "function" ? v(...args) : v; };

let stackBlocks = [];
let solutions = new Set();
let blockIdCounter = 0;

const stackColumn = document.getElementById("stackColumn");
const paletteEl = document.getElementById("palette");
const paletteGrid = document.getElementById("paletteGrid");
const targetBlockHolder = document.getElementById("targetBlockHolder");
const targetNumEl = document.getElementById("targetNum");
const counterEl = document.getElementById("counter");
const feedbackEl = document.getElementById("feedback");
const solutionsList = document.getElementById("solutionsList");
const solutionsCount = document.getElementById("solutionsCount");

function buildPalette() {
  paletteGrid.innerHTML = "";
  for (let i = 1; i <= 10; i++) {
    if (i === TARGET) continue;
    paletteGrid.appendChild(createBlockEl(i, "palette"));
  }
}

function buildTarget() {
  targetBlockHolder.innerHTML = "";
  targetNumEl.textContent = TARGET;
  targetBlockHolder.appendChild(createBlockEl(TARGET, "target"));
}

function createBlockEl(value, location) {
  const block = document.createElement("div");
  block.className = "block";
  block.style.height = (UNIT * value) + "px";
  block.style.background = COLORS[value];
  block.dataset.value = value;
  block.dataset.location = location;
  if (location === "target") block.classList.add("target-block");

  const dotsWrap = document.createElement("div");
  dotsWrap.className = "block-dots";
  let remaining = value;
  while (remaining > 0) {
    const row = document.createElement("div");
    row.className = "dot-row";
    const inThisRow = Math.min(2, remaining);
    for (let k = 0; k < inThisRow; k++) {
      const d = document.createElement("div");
      d.className = "dot";
      row.appendChild(d);
    }
    dotsWrap.appendChild(row);
    remaining -= inThisRow;
  }
  block.appendChild(dotsWrap);

  const num = document.createElement("div");
  num.className = "block-num";
  num.textContent = value;
  block.appendChild(num);

  if (location !== "target") attachDragHandlers(block, value);
  return block;
}

function attachDragHandlers(block, value) {
  let dragState = null;

  block.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const rect = block.getBoundingClientRect();
    dragState = {
      startX: e.clientX, startY: e.clientY,
      offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
      width: rect.width, height: rect.height,
      ghost: null, moved: false, pointerId: e.pointerId,
    };
    try { block.setPointerCapture(e.pointerId); } catch(_) {}
  });

  block.addEventListener("pointermove", (e) => {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (!dragState.moved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;

    if (!dragState.moved) {
      dragState.moved = true;
      const ghost = block.cloneNode(true);
      ghost.classList.add("ghost");
      ghost.style.width = dragState.width + "px";
      ghost.style.height = dragState.height + "px";
      ghost.style.left = (e.clientX - dragState.offsetX) + "px";
      ghost.style.top = (e.clientY - dragState.offsetY) + "px";
      document.body.appendChild(ghost);
      dragState.ghost = ghost;
      block.classList.add("dragging");
    }

    if (dragState.ghost) {
      dragState.ghost.style.left = (e.clientX - dragState.offsetX) + "px";
      dragState.ghost.style.top = (e.clientY - dragState.offsetY) + "px";
    }

    const overStack = isOverEl(e, stackColumn);
    const overPalette = isOverEl(e, paletteEl);
    stackColumn.classList.toggle("dragover", overStack && block.dataset.location === "palette");
    paletteEl.classList.toggle("dragover", overPalette && block.dataset.location === "stack");
  });

  block.addEventListener("pointerup", (e) => {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    const wasMoved = dragState.moved;
    if (dragState.ghost) dragState.ghost.remove();
    block.classList.remove("dragging");
    stackColumn.classList.remove("dragover");
    paletteEl.classList.remove("dragover");
    try { block.releasePointerCapture(e.pointerId); } catch(_) {}

    const fromLocation = block.dataset.location;
    const overStack = wasMoved && isOverEl(e, stackColumn);
    const overPalette = wasMoved && isOverEl(e, paletteEl);

    if (fromLocation === "palette") {
      if (!wasMoved || overStack) addToStack(value);
    } else if (fromLocation === "stack") {
      if (overPalette || (wasMoved && !overStack)) {
        removeFromStack(parseInt(block.dataset.id));
      }
    }
    dragState = null;
  });

  block.addEventListener("pointercancel", () => {
    if (!dragState) return;
    if (dragState.ghost) dragState.ghost.remove();
    block.classList.remove("dragging");
    stackColumn.classList.remove("dragover");
    paletteEl.classList.remove("dragover");
    dragState = null;
  });
}

function isOverEl(e, el) {
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}

function addToStack(value) {
  const id = ++blockIdCounter;
  stackBlocks.push({ id, value });
  renderStack();
  updateUI();
}

function removeFromStack(id) {
  stackBlocks = stackBlocks.filter(b => b.id !== id);
  renderStack();
  updateUI();
}

function renderStack() {
  stackColumn.innerHTML = '<div class="stack-column-zone-hint">' + t("dropHere") + '</div>';
  stackColumn.classList.toggle("empty", stackBlocks.length === 0);
  stackBlocks.forEach(b => {
    const el = createBlockEl(b.value, "stack");
    el.dataset.id = b.id;
    stackColumn.appendChild(el);
  });
}

function updateUI() {
  const sum = stackBlocks.reduce((a, b) => a + b.value, 0);
  counterEl.textContent = sum;
  counterEl.classList.remove("match", "over");
  if (sum === TARGET) counterEl.classList.add("match");
  else if (sum > TARGET) counterEl.classList.add("over");

  feedbackEl.classList.remove("success", "discover");
  const icon = feedbackEl.querySelector(".feedback-icon");
  const text = feedbackEl.querySelector(".feedback-text");

  if (sum === 0) { icon.textContent = "🌱"; text.textContent = t("fb_empty"); }
  else if (sum === TARGET) {
    feedbackEl.classList.add("success");
    icon.textContent = "🎯"; text.textContent = t("fb_match", TARGET);
    registerSolution();
  } else if (sum < TARGET) { icon.textContent = "🧩"; text.textContent = t("fb_under", sum, TARGET); }
  else { icon.textContent = "💭"; text.textContent = t("fb_over", sum, TARGET); }
}

function registerSolution() {
  const key = stackBlocks.map(b => b.value).sort((a, b) => a - b).join("+");
  if (!solutions.has(key)) {
    solutions.add(key);
    renderSolutions();
    celebrate();
    setTimeout(() => {
      const text = feedbackEl.querySelector(".feedback-text");
      const icon = feedbackEl.querySelector(".feedback-icon");
      feedbackEl.classList.add("discover");
      feedbackEl.classList.remove("success");
      icon.textContent = "✨";
      text.textContent = t("fb_new_solution");
    }, 150);
  }
}

function renderSolutions() {
  solutionsCount.textContent = solutions.size;
  if (solutions.size === 0) {
    solutionsList.innerHTML = `<span class="solutions-empty">${t("noSolutions")}</span>`;
    return;
  }
  solutionsList.innerHTML = "";
  Array.from(solutions).sort().forEach(key => {
    const chip = document.createElement("div");
    chip.className = "solution-chip";
    chip.innerHTML = `<span class="solution-chip-star">★</span><span>${key.replace(/\+/g, " + ")}</span>`;
    solutionsList.appendChild(chip);
  });
}

function celebrate() {
  const colors = ["#d77a4b", "#6b8e4e", "#e8b04b", "#5a8fb8", "#ba68c8"];
  const container = document.getElementById("celebrate");
  for (let i = 0; i < 36; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.4 + "s";
    c.style.animationDuration = (1.2 + Math.random() * 0.8) + "s";
    container.appendChild(c);
    setTimeout(() => c.remove(), 2400);
  }
}

document.getElementById("clearBtn").addEventListener("click", () => {
  stackBlocks = [];
  renderStack();
  updateUI();
});

document.getElementById("newTargetBtn").addEventListener("click", () => {
  let newTarget;
  do { newTarget = 3 + Math.floor(Math.random() * 8); } while (newTarget === TARGET);
  TARGET = newTarget;
  stackBlocks = [];
  solutions.clear();
  buildPalette();
  buildTarget();
  renderStack();
  updateUI();
  renderSolutions();
});

document.getElementById("langSwitch").addEventListener("click", (e) => {
  const btn = e.target.closest(".lang-btn");
  if (!btn) return;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentLang = btn.dataset.lang;
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (i18n[currentLang][key] && typeof i18n[currentLang][key] === "string") {
      el.textContent = i18n[currentLang][key];
    }
  });
  renderStack();
  renderSolutions();
  updateUI();
});

buildPalette();
buildTarget();
renderStack();
updateUI();
renderSolutions();
console.log("[Zahlenwerkstatt v4] Bereit. Ziel:", TARGET);
</script>
</body>
</html>
